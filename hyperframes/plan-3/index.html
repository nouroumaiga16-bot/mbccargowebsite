<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan 3 - Angoisse MBC Cargo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100%;
            height: 100vh;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        
        .container {
            position: relative;
            width: 1920px;
            height: 1080px;
            background: linear-gradient(135deg, #2d2d2d 0%, #1a1a1a 100%);
            overflow: hidden;
        }
        
        /* Homme fermant la boîte */
        .man {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 300px;
            animation: slideInMan 1s ease-in-out;
        }
        
        .man-head {
            width: 50px;
            height: 50px;
            background: #D4A574;
            border-radius: 50%;
            margin: 0 auto;
        }
        
        .man-body {
            width: 70px;
            height: 100px;
            background: #4169E1;
            margin: 15px auto 0;
            border-radius: 10px;
        }
        
        .man-legs {
            width: 25px;
            height: 80px;
            background: #333;
            margin: 0 auto;
        }
        
        /* Boîte fermée */
        .box-closed {
            position: absolute;
            left: 50%;
            top: 380px;
            transform: translateX(-50%);
            width: 200px;
            height: 120px;
            background: #D2691E;
            border: 2px solid #8B4513;
            border-radius: 5px;
            animation: boxAppear 1s ease-in-out;
        }
        
        /* Questions flottantes */
        .question {
            position: absolute;
            font-size: 32px;
            font-weight: bold;
            font-family: 'Montserrat', sans-serif;
            color: #FF4444;
            text-shadow: 2px 2px 10px rgba(255, 68, 68, 0.5);
            animation: float 3s ease-in-out infinite;
        }
        
        .question-1 {
            top: 150px;
            left: 100px;
            animation-delay: 0s;
        }
        
        .question-2 {
            top: 250px;
            right: 100px;
            animation-delay: 0.5s;
        }
        
        .question-mark {
            position: absolute;
            font-size: 48px;
            color: #FF8800;
            opacity: 0.3;
            animation: spin 4s linear infinite;
        }
        
        .question-mark-1 {
            top: 200px;
            left: 300px;
            animation-delay: 0.2s;
        }
        
        .question-mark-2 {
            bottom: 200px;
            right: 200px;
            animation-delay: 0.8s;
        }
        
        /* Animations */
        @keyframes slideInMan {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) translateY(0);
            }
        }
        
        @keyframes boxAppear {
            from {
                opacity: 0;
                transform: translateX(-50%) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) scale(1);
            }
        }
        
        @keyframes float {
            0%, 100% {
                opacity: 0.5;
                transform: translateY(0);
            }
            50% {
                opacity: 1;
                transform: translateY(-20px);
            }
        }
        
        @keyframes spin {
            from {
                transform: rotateZ(0deg) scale(1);
            }
            to {
                transform: rotateZ(360deg) scale(1.5);
            }
        }
        
        /* Texte principal */
        .text-overlay {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: #FF6B6B;
            font-size: 28px;
            font-weight: bold;
            font-family: 'Montserrat', sans-serif;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
            animation: fadeInText 1s ease-in-out;
            text-align: center;
            max-width: 800px;
            line-height: 1.5;
        }
        
        @keyframes fadeInText {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
<style>html,body{width:1920px;height:1080px;margin:0;overflow:hidden}</style>
</head>
<body>
<div id="root" data-composition-id="plan-3" data-start="0" data-no-timeline data-duration="4" data-width="1920" data-height="1080">
    <div class="container">
        <!-- Homme -->
        <div class="man">
            <div class="man-head"></div>
            <div class="man-body"></div>
            <div class="man-legs"></div>
        </div>
        
        <!-- Boîte fermée -->
        <div class="box-closed"></div>
        
        <!-- Questions flottantes -->
        <div class="question question-1">Va-t-elle arriver ?</div>
        <div class="question question-2">Combien ça va coûter ?</div>
        
        <!-- Points d'interrogation flottants -->
        <div class="question-mark question-mark-1">?</div>
        <div class="question-mark question-mark-2">?</div>
        
        <!-- Texte -->
        <div class="text-overlay">
            L'angoisse de l'incertitude...
        </div>
    </div>
</div>
</body>
</html>
