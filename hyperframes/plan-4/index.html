<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan 4 - Pivot MBC Cargo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100%;
            height: 100vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        
        .container {
            position: relative;
            width: 1920px;
            height: 1080px;
            background: #000;
            overflow: hidden;
        }
        
        /* Logo MBC Cargo */
        .logo {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            animation: logoAppear 2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        
        .logo-box {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2563EB 0%, #EA580C 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: white;
            font-family: 'Montserrat', sans-serif;
            box-shadow: 0 20px 60px rgba(37, 99, 235, 0.6);
        }
        
        /* Titre */
        .title {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 56px;
            font-weight: bold;
            color: white;
            font-family: 'Montserrat', sans-serif;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.8);
            animation: titleAppear 1.5s ease-in-out 0.3s both;
            letter-spacing: 2px;
        }
        
        /* Sous-titre */
        .subtitle {
            position: absolute;
            top: 180px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            color: #EA580C;
            font-family: 'Montserrat', sans-serif;
            animation: subtitleAppear 1.5s ease-in-out 0.5s both;
        }
        
        /* Icônes */
        .icons-container {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 80px;
            width: 100%;
            justify-content: center;
        }
        
        .icon-box {
            width: 120px;
            height: 120px;
            background: rgba(37, 99, 235, 0.2);
            border: 2px solid #2563EB;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
            animation: iconAppear 1.5s ease-in-out forwards;
        }
        
        .icon-box:nth-child(1) {
            animation-delay: 0.8s;
        }
        
        .icon-box:nth-child(2) {
            animation-delay: 1s;
        }
        
        .icon-box:nth-child(3) {
            animation-delay: 1.2s;
        }
        
        .icon-symbol {
            font-size: 32px;
            color: #EA580C;
        }
        
        .icon-text {
            font-size: 12px;
            color: white;
            text-align: center;
            font-family: 'Inter', sans-serif;
        }
        
        /* Animations */
        @keyframes logoAppear {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0) rotateY(90deg);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1) rotateY(0deg);
            }
        }
        
        @keyframes titleAppear {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        @keyframes subtitleAppear {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        @keyframes iconAppear {
            from {
                opacity: 0;
                transform: scale(0) rotateZ(-45deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotateZ(0deg);
            }
        }
        
        /* Glow effect */
        .glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.3) 0%, transparent 70%);
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            animation: glowPulse 2s ease-in-out infinite;
            animation-delay: 1.5s;
        }
        
        @keyframes glowPulse {
            0%, 100% {
                opacity: 0.3;
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                opacity: 0.6;
                transform: translate(-50%, -50%) scale(1.2);
            }
        }
    </style>
<style>html,body{width:1920px;height:1080px;margin:0;overflow:hidden}</style>
</head>
<body>
<div id="root" data-composition-id="plan-4" data-start="0" data-no-timeline data-duration="4" data-width="1920" data-height="1080">
    <div class="container">
        <!-- Glow background -->
        <div class="glow"></div>
        
        <!-- Titre -->
        <div class="title">MBC Cargo</div>
        
        <!-- Sous-titre -->
        <div class="subtitle">Depuis 8 ans</div>
        
        <!-- Logo -->
        <div class="logo">
            <div class="logo-box">MBC</div>
        </div>
        
        <!-- Icônes -->
        <div class="icons-container">
            <div class="icon-box">
                <div class="icon-symbol">✓</div>
                <div class="icon-text">Dédouanement</div>
            </div>
            <div class="icon-box">
                <div class="icon-symbol">💬</div>
                <div class="icon-text">WhatsApp</div>
            </div>
            <div class="icon-box">
                <div class="icon-symbol">💰</div>
                <div class="icon-text">Prix Clair</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
