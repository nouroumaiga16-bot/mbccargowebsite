<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan 1 - Ouverture MBC Cargo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #FFA500 0%, #FFB84D 50%, #87CEEB 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        
        .container {
            position: relative;
            width: 1920px;
            height: 1080px;
            background: linear-gradient(to bottom, #87CEEB 0%, #FFD700 50%, #8B4513 100%);
            overflow: hidden;
        }
        
        /* Maison à Ouagadougou */
        .house {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 350px;
            background: linear-gradient(135deg, #D2691E 0%, #CD853F 100%);
            border-radius: 10px;
            box-shadow: -20px 20px 60px rgba(0, 0, 0, 0.3);
            animation: appearHouse 2s ease-in-out;
        }
        
        .roof {
            position: absolute;
            top: -40px;
            left: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(135deg, #8B4513 0%, #A0522D 100%);
            clip-path: polygon(0 100%, 50% 0%, 100% 100%);
        }
        
        .door {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 150px;
            background: #654321;
            border-radius: 5px;
            border: 3px solid #8B4513;
        }
        
        .window {
            position: absolute;
            width: 60px;
            height: 60px;
            background: #87CEEB;
            border-radius: 5px;
            border: 2px solid #8B4513;
        }
        
        .window-1 {
            top: 80px;
            left: 40px;
        }
        
        .window-2 {
            top: 80px;
            right: 40px;
        }
        
        /* Femme assise */
        .woman {
            position: absolute;
            left: 20%;
            top: 200px;
            width: 150px;
            height: 200px;
            animation: appearWoman 2s ease-in-out 0.5s both;
        }
        
        .woman-head {
            width: 50px;
            height: 50px;
            background: #D4A574;
            border-radius: 50%;
            margin: 0 auto;
            position: relative;
        }
        
        .woman-body {
            width: 60px;
            height: 80px;
            background: #FF6B9D;
            margin: 10px auto 0;
            border-radius: 10px 10px 0 0;
        }
        
        .woman-legs {
            width: 20px;
            height: 60px;
            background: #8B6F47;
            margin: 0 auto;
        }
        
        /* Soleil */
        .sun {
            position: absolute;
            top: 50px;
            right: 100px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #FFD700, #FFA500);
            border-radius: 50%;
            box-shadow: 0 0 60px #FFA500;
            animation: sunGlow 2s ease-in-out infinite;
        }
        
        /* Texte */
        .text-overlay {
            position: absolute;
            bottom: 100px;
            right: 100px;
            color: white;
            font-size: 32px;
            font-weight: bold;
            font-family: 'Montserrat', sans-serif;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
            animation: fadeInText 1.5s ease-in-out 0.3s both;
            max-width: 600px;
            line-height: 1.4;
        }
        
        /* Animations */
        @keyframes appearHouse {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        @keyframes appearWoman {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes sunGlow {
            0%, 100% {
                box-shadow: 0 0 60px #FFA500;
            }
            50% {
                box-shadow: 0 0 80px #FFD700;
            }
        }
        
        @keyframes fadeInText {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
<style>html,body{width:1080px;height:1920px;margin:0;overflow:hidden}
/* Plan 1 — Ouverture, 9:16 */
.container { width: 1080px; height: 1920px; }
.sun { top: 140px; right: 90px; width: 170px; height: 170px; }
.text-overlay { top: 420px; bottom: auto; left: 60px; right: 60px; max-width: none; text-align: center; font-size: 60px; }
.house { bottom: 280px; width: 540px; height: 460px; }
.roof { top: -60px; height: 110px; }
.window { width: 90px; height: 90px; }
.window-1 { top: 110px; left: 60px; }
.window-2 { top: 110px; right: 60px; }
.door { width: 110px; height: 210px; }
.woman { left: 70px; top: auto; bottom: 280px; height: auto; }
.woman-head { width: 72px; height: 72px; }
.woman-body { width: 86px; height: 115px; }
.woman-legs { width: 28px; height: 86px; }
</style>
</head>
<body>
<div id="root" data-composition-id="plan-1" data-start="0" data-no-timeline data-duration="2" data-width="1080" data-height="1920">
    <div class="container">
        <!-- Soleil -->
        <div class="sun"></div>
        
        <!-- Maison -->
        <div class="house">
            <div class="roof"></div>
            <div class="window window-1"></div>
            <div class="window window-2"></div>
            <div class="door"></div>
        </div>
        
        <!-- Femme -->
        <div class="woman">
            <div class="woman-head"></div>
            <div class="woman-body"></div>
            <div class="woman-legs"></div>
        </div>
        
        <!-- Texte -->
        <div class="text-overlay">
            Vous pensez à votre mère à Ouaga.
        </div>
    </div>
</div>
</body>
</html>
