<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan 7 - Fermeture MBC Cargo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100%;
            height: 100vh;
            background: #FFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        
        .container {
            position: relative;
            width: 1920px;
            height: 1080px;
            background: linear-gradient(135deg, #FFF 0%, #F5FBFF 100%);
            overflow: hidden;
        }
        
        /* Split screen finale */
        .split-container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        
        .split-side {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .side-montreal {
            background: linear-gradient(135deg, #E8F4F8, #F0F8FF);
            border-right: 2px solid #2563EB;
        }
        
        .side-ouaga {
            background: linear-gradient(135deg, #FFF8DC, #FFFACD);
        }
        
        /* Homme à Montréal */
        .man {
            text-align: center;
            animation: slideInMan 1s ease-in-out;
        }
        
        .man-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        
        .man-text {
            font-size: 20px;
            color: #2563EB;
            font-family: 'Montserrat', sans-serif;
            font-weight: bold;
            margin-top: 10px;
        }
        
        /* Téléphone avec WhatsApp */
        .phone {
            width: 180px;
            height: 320px;
            background: white;
            border-radius: 20px;
            border: 8px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            box-shadow: -10px 10px 40px rgba(0, 0, 0, 0.2);
            margin: 20px auto 0;
            animation: phoneSlide 1s ease-in-out 0.3s both;
        }
        
        .whatsapp-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .button-cta {
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            animation: pulse 1.5s ease-in-out infinite 1s;
        }
        
        /* Femme à Ouagadougou */
        .woman {
            text-align: center;
            animation: slideInWoman 1s ease-in-out;
        }
        
        .woman-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        
        .woman-text {
            font-size: 20px;
            color: #EA580C;
            font-family: 'Montserrat', sans-serif;
            font-weight: bold;
            margin-top: 10px;
        }
        
        /* Notification */
        .notification-final {
            background: #D4EDDA;
            border-left: 4px solid #28A745;
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
            color: #155724;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            animation: popNotif 1s ease-in-out 0.8s both;
        }
        
        /* CTA Principal */
        .cta-main {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            animation: slideInCTA 1.2s ease-in-out 1s both;
            z-index: 10;
        }
        
        .cta-text {
            font-size: 42px;
            font-weight: bold;
            color: #EA580C;
            font-family: 'Montserrat', sans-serif;
            margin-bottom: 15px;
            line-height: 1.3;
        }
        
        .cta-button {
            background: linear-gradient(135deg, #EA580C, #FF6B35);
            color: white;
            padding: 16px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(234, 88, 12, 0.4);
            animation: buttonPulse 1.5s ease-in-out infinite 1.8s;
        }
        
        .contact-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 14px;
            color: #666;
            animation: fadeIn 1.5s ease-in-out 1.5s both;
        }
        
        .contact-item {
            display: inline-block;
            margin: 0 20px;
        }
        
        .logo-final {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            font-weight: bold;
            color: #2563EB;
            font-family: 'Montserrat', sans-serif;
            animation: fadeIn 1s ease-in-out;
        }
        
        /* Animations */
        @keyframes slideInMan {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        @keyframes slideInWoman {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        @keyframes phoneSlide {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes popNotif {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes slideInCTA {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(37, 211, 102, 0);
            }
        }
        
        @keyframes buttonPulse {
            0%, 100% {
                box-shadow: 0 8px 20px rgba(234, 88, 12, 0.4);
            }
            50% {
                box-shadow: 0 8px 30px rgba(234, 88, 12, 0.7);
            }
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>

</head>
