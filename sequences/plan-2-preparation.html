<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan 2 - Préparation MBC Cargo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100%;
            height: 100vh;
            background: #F0F0F0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        
        .container {
            position: relative;
            width: 1920px;
            height: 1080px;
            background: white;
            overflow: hidden;
            display: flex;
        }
        
        /* Split screen */
        .side {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .side-ouaga {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            opacity: 0.5;
        }
        
        .side-montreal {
            background: linear-gradient(135deg, #E8F4F8 0%, #F0F8FF 100%);
        }
        
        /* Montréal - Kitchen */
        .kitchen {
            position: absolute;
            width: 500px;
            height: 500px;
            animation: slideInMontreal 1s ease-in-out;
        }
        
        .table {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 200px;
            background: #8B6F47;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .box {
            position: absolute;
            left: 50%;
            bottom: 300px;
            transform: translateX(-50%);
            width: 200px;
            height: 150px;
            background: #D2691E;
            border: 2px solid #8B4513;
            animation: boxPresent 3s ease-in-out;
        }
        
        /* Objets animés */
        .item {
            position: absolute;
            animation: itemDrop 1.5s ease-in-out forwards;
        }
        
        .clothes {
            width: 80px;
            height: 60px;
            background: linear-gradient(135deg, #FF6B9D, #FF69B4);
            border-radius: 5px;
            left: 200px;
            top: 150px;
            animation-delay: 0.3s;
        }
        
        .vitamins {
            width: 50px;
            height: 80px;
            background: #FFD700;
            border-radius: 3px;
            left: 150px;
            top: 250px;
            animation-delay: 1s;
        }
        
        .money {
            width: 100px;
            height: 50px;
            background: linear-gradient(90deg, #228B22, #32CD32);
            border-radius: 2px;
            left: 250px;
            top: 280px;
            animation-delay: 1.8s;
            box-shadow: 0 0 20px rgba(50, 205, 50, 0.6);
        }
        
        .man-head {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #D4A574;
            border-radius: 50%;
            right: 80px;
            top: 120px;
            animation: slideInMontreal 1s ease-in-out;
        }
        
        /* Animations */
        @keyframes slideInMontreal {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        @keyframes boxPresent {
            0% {
                opacity: 0;
                transform: translateX(-50%) scale(0.5) rotateY(90deg);
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 1;
                transform: translateX(-50%) scale(1) rotateY(0deg);
            }
        }
        
        @keyframes itemDrop {
            from {
                opacity: 0;
                transform: translateY(-100px) rotateZ(-20deg);
            }
            to {
                opacity: 1;
                transform: translateY(0) rotateZ(0deg);
            }
        }
        
        /* Texte */
        .text-overlay {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: #2563EB;
            font-size: 28px;
            font-weight: bold;
            font-family: 'Montserrat', sans-serif;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            animation: fadeInText 1s ease-in-out;
            max-width: 1200px;
            text-align: center;
            line-height: 1.4;
        }
        
        @keyframes fadeInText {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Split - Ouaga (muted) -->
        <div class="side side-ouaga"></div>
        
        <!-- Split - Montréal (active) -->
        <div class="side side-montreal">
            <div class="kitchen">
                <!-- Homme -->
                <div class="man-head"></div>
                
                <!-- Table -->
                <div class="table"></div>
                
                <!-- Boîte -->
                <div class="box"></div>
                
                <!-- Objets en animation -->
                <div class="item clothes"></div>
                <div class="item vitamins"></div>
                <div class="item money"></div>
            </div>
        </div>
        
        <!-- Texte -->
        <div class="text-overlay">
            Vous remplissez une boîte : des vêtements, des vitamines, un peu d'argent.
        </div>
    </div>
</body>
</html>
